framework:
    secret: '%env(APP_SECRET)%'
    default_locale: nl
    csrf_protection: true
    http_method_override: false
    handle_all_throwables: true
    trusted_proxies: '%env(default::TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-host', 'x-forwarded-port']
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native
        # Eigen map zodat de cron van het OS sessies van de tik-pc niet wist.
        save_path: '%kernel.project_dir%/var/sessions/%kernel.environment%'
        gc_maxlifetime: 604800
    php_errors:
        log: true
    router:
        default_uri: '%env(default:default_base_url:APP_BASE_URL)%'

parameters:
    default_base_url: 'http://localhost'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
